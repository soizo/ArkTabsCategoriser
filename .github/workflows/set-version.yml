name: Set extension version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (for example: 0.1.9)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: set-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  set-version:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Update version files
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: node scripts/set-version.cjs "$NEW_VERSION"

      - name: Test and build
        run: |
          npm ci
          node --test scripts/set-version.test.cjs
          npm run verify

      - name: Commit version change
        env:
          NEW_VERSION: ${{ inputs.version }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Version is already ${NEW_VERSION}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: set extension version to ${NEW_VERSION}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "Updated extension version to ${NEW_VERSION} on ${TARGET_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
